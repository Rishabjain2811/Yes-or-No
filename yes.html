<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17120f" />
    <title>Knew it!</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-width: 320px;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        overflow: hidden;
        padding: 24px;
        color: #fff8ef;
        background: linear-gradient(135deg, rgb(23 18 15 / 58%), rgb(23 18 15 / 38%)), url("./r%20.jpeg") center / cover no-repeat fixed;
        place-items: center;
      }

      body::before {
        position: fixed;
        pointer-events: none;
        content: "";
        inset: 0;
        opacity: 0.18;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.16'/%3E%3C/svg%3E");
      }

      .message {
        position: relative;
        z-index: 1;
        width: min(100%, 760px);
        padding: clamp(42px, 9vw, 86px) 24px;
        border: 1px solid rgb(255 231 204 / 18%);
        border-radius: 34px;
        background: linear-gradient(145deg, rgb(60 42 31 / 12%), rgb(34 26 20 / 10%));
        box-shadow: 0 32px 100px rgb(0 0 0 / 38%), inset 0 1px 0 rgb(255 255 255 / 16%), 0 0 90px rgb(255 126 67 / 12%);
        text-align: center;
        backdrop-filter: blur(3px);
        animation: pop 700ms cubic-bezier(0.16, 1, 0.3, 1) both, levitate 7s ease-in-out 700ms infinite;
      }

      .emoji {
        display: block;
        margin-bottom: 14px;
        font-size: clamp(2.6rem, 8vw, 4.5rem);
        animation: celebrate 1.2s ease-in-out infinite alternate;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.8rem, 10vw, 6.4rem);
        font-weight: 780;
        letter-spacing: -0.08em;
        line-height: 1;
      }

      h1 span {
        display: block;
        margin-top: 12px;
        color: #ffdc72;
        text-shadow: 0 8px 36px rgb(255 161 100 / 24%);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 0.78em;
        font-style: italic;
        font-weight: 500;
        letter-spacing: -0.07em;
      }

      p {
        margin: 26px 0 0;
        color: #d3c4b5;
        font-size: 0.95rem;
      }

      .back {
        display: inline-block;
        margin-top: 32px;
        color: #ffdc72;
        font-size: 0.86rem;
        font-weight: 700;
        text-decoration: none;
      }

      .back:hover {
        text-decoration: underline;
        text-underline-offset: 4px;
      }

      .confetti {
        position: fixed;
        top: -12px;
        z-index: 0;
        width: 9px;
        height: 16px;
        border-radius: 3px;
        animation: fall var(--duration) linear var(--delay) infinite;
        background: var(--color);
        left: var(--left);
      }

      @keyframes night-shift {
        to {
          background-position: 100% 80%;
        }
      }

      @keyframes levitate {
        0%, 100% {
          translate: 0 0;
        }
        50% {
          translate: 0 -7px;
        }
      }

      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(22px) scale(0.94);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes celebrate {
        from {
          transform: rotate(-10deg) scale(0.94);
        }
        to {
          transform: rotate(10deg) scale(1.08);
        }
      }

      @keyframes fall {
        to {
          transform: translate3d(40px, 110vh, 0) rotate(540deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="message">
      <span class="emoji" aria-hidden="true">🥳</span>
      <h1>I knew it bro!<span>lessgoo</span></h1>
      <p>Correct answer. Excellent taste. 10/10 decision-making.</p>
      <a class="back" href="index.html">← run it back</a>
    </main>
    <script>
      const colors = ["#ff795e", "#ffbd59", "#ffe27a", "#f18e78", "#83b9a2"];
      for (let index = 0; index < 32; index += 1) {
        const confetti = document.createElement("span");
        confetti.className = "confetti";
        confetti.setAttribute("aria-hidden", "true");
        confetti.style.setProperty("--left", `${Math.random() * 100}%`);
        confetti.style.setProperty("--color", colors[index % colors.length]);
        confetti.style.setProperty("--delay", `${Math.random() * -8}s`);
        confetti.style.setProperty("--duration", `${5 + Math.random() * 5}s`);
        document.body.append(confetti);
      }
    </script>
  </body>
</html>
